<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Somtum App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e3342a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Somtum">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<script src="config.js"></script>
  <script src="belimanual.js?v=7"></script>
<style>
:root{--red:#e3342a;--red-d:#b8241c;--red-deep:#a91f18;--red-l:#fdecea;--ink:#1f1f1f;--mut:#6b6b6b;--line:#e6e6e6;--bg:#f4f1ee;--card:#fff;--ok:#1d9e75;--ok-l:#e1f5ee;--warn:#ba7517;--warn-l:#faeeda;--bad:#c62828;--bad-l:#fcebeb;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header.top{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 4px 14px rgba(20,20,20,.05);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px}
header.top .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
header.top .logo{width:38px;height:38px;border-radius:12px}
.iconbtn{border:0;background:#f0eeec;width:38px;height:38px;border-radius:11px;font-size:22px;line-height:1;color:var(--ink)}
.chip{font-size:12px;background:var(--red-l);color:var(--red-d);padding:5px 11px;border-radius:999px;font-weight:700}
main{padding:14px;max-width:560px;margin:0 auto;position:relative;z-index:1}
main.homemain{margin-top:-30px;padding-top:0}
main.embed{padding:0;max-width:none}
.ilist{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(20,20,20,.05);margin-bottom:14px;overflow:hidden}
.irow{display:flex;align-items:center;gap:12px;padding:12px}
.irow+.irow{border-top:1px solid #f1efec}
.iswatch{width:34px;height:34px;border-radius:10px;flex:none}
.itxt{flex:1;min-width:0}
.itxt-t{font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itxt-s{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.embed-frame{width:100%;height:calc(100dvh - 62px);border:0;display:block;background:#fff}
body.has-nav .embed-frame{height:calc(100dvh - 62px - 82px)}

/* ---- hero header (beranda) ---- */
.hero{background:linear-gradient(160deg,var(--red) 0%,var(--red-deep) 100%);padding:calc(14px + env(safe-area-inset-top)) 18px 48px;border-radius:0 0 26px 26px;position:relative;z-index:2;max-width:560px;margin:0 auto}
.hero-row{display:flex;align-items:center;gap:12px}
.hero-logo{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.hero-logo img{width:100%;height:100%;object-fit:cover;display:block}
.hero-txt{flex:1;min-width:0}
.hero-title{color:#fff;font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-sub{color:rgba(255,255,255,.82);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);border:0;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;cursor:pointer}
.pills{display:flex;gap:8px;margin-top:16px;overflow-x:auto}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;border:0;cursor:pointer;font-family:inherit}
.pill:active{transform:scale(.96)}

/* ---- bottom nav ---- */
#botnav{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:none;align-items:flex-start;justify-content:space-around;padding-top:9px;z-index:30;box-shadow:0 -6px 20px rgba(0,0,0,.06);max-width:560px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
body.has-nav #botnav{display:flex}
body.has-nav main{padding-bottom:82px}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#aaa;background:none;border:0;font:inherit;cursor:pointer;flex:1;font-family:inherit}
.bn-item.on{color:var(--red-deep)}
.bn-item svg{width:21px;height:21px}
.bn-item span{font-size:10.5px;font-weight:700}
.bn-fab{width:50px;height:50px;border-radius:16px;background:linear-gradient(160deg,var(--red),var(--red-deep));display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 8px 18px rgba(227,52,42,.35);border:0;cursor:pointer;flex:none}
.bn-fab:active{transform:scale(.94)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(20,20,20,.05)}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:600;padding:13px 16px;border-radius:14px;width:100%;cursor:pointer;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(160deg,var(--red),var(--red-deep));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(227,52,42,.28)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:8px 12px;font-size:14px;width:auto}
.btn.ghost{background:transparent;border-color:transparent;color:var(--red-d)}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:96px;cursor:pointer;box-shadow:0 4px 14px rgba(20,20,20,.05);transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.tile .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--red-l);color:var(--red-d)}
.grid .tile:nth-of-type(5n+2) .ic{background:#eef0ff;color:#4c5fd5}
.grid .tile:nth-of-type(5n+3) .ic{background:#e9f7f0;color:#189267}
.grid .tile:nth-of-type(5n+4) .ic{background:#fff3e6;color:#c4740a}
.grid .tile:nth-of-type(5n+5) .ic{background:#f3ecff;color:#7c3aed}
.tile .lb{font-weight:700;font-size:14px}
.tile .sb{font-size:12px;color:var(--mut)}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;font-weight:600}
label.f .req{color:var(--red)}
.help{font-size:12px;color:var(--mut);margin:-2px 0 6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=datetime-local],input[type=month],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #d5d5d5;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input.err,select.err,.sel.err input{border-color:var(--bad);background:#fff8f8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid #d5d5d5;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;color:var(--ink);cursor:pointer}
.chipb.on{background:var(--red);color:#fff;border-color:var(--red)}
.chipb.ok.on{background:var(--ok);border-color:var(--ok)}
.chipb.warn.on{background:var(--warn);border-color:var(--warn)}
.chipb.bad.on{background:var(--bad);border-color:var(--bad)}
.sel{position:relative}
.selopts{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d5d5d5;border-radius:10px;max-height:240px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.selopts div{padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px}
.selopts div:last-child{border-bottom:0}
.hidden{display:none}
.cb{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.cb:last-child{border-bottom:0}
.box{width:24px;height:24px;border:2px solid #c9c9c9;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;color:#fff}
.cb.on .box{background:var(--ok);border-color:var(--ok)}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.b-ok{background:var(--ok-l);color:#0f6e56}.b-warn{background:var(--warn-l);color:#854f0b}.b-bad{background:var(--bad-l);color:#a32d2d}.b-mut{background:#eee;color:#555}
.big{font-size:28px;font-weight:700}
.rowcard{border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin:10px 0;background:#fff;box-shadow:0 4px 14px rgba(20,20,20,.05)}
.rowcard .rh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:var(--red-d)}
.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#eee;flex:none}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{color:var(--mut);font-weight:600;font-size:12px}
table.t select{padding:6px 4px;font-size:13px;border-radius:7px}
.wrap{overflow:auto;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(6px);background:#222;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;background:rgba(244,241,238,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:40;font-weight:600;opacity:0;transition:opacity .15s ease}
#loading.on{display:flex;opacity:1}
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(20,20,20,.45);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:45}
#modal.on{display:flex}
#modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
#modal.on .sheet{animation:sheetUp .22s cubic-bezier(.2,.7,.3,1)}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#modal.on .sheet{animation:none}}
.center{text-align:center}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.sep{height:1px;background:var(--line);margin:12px 0}
.pin{letter-spacing:10px;text-align:center;font-size:24px}
.banner{background:#fff8e6;border:1px solid #f3dfa6;border-radius:12px;padding:10px 12px;font-size:13px;color:#6b4e00;margin-bottom:12px}
a{color:var(--red-d)}
#app.pg-fwd{animation:pgIn .22s cubic-bezier(.2,.7,.3,1)}
#app.pg-back{animation:pgInBack .22s cubic-bezier(.2,.7,.3,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pgInBack{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#app.pg-fwd,#app.pg-back{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="botnav"></div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div><div id="loadingText">Memproses…</div></div>
<div id="modal"><div class="sheet" id="modalBody"></div></div>
<input type="file" id="camUser" accept="image/*" capture="user" hidden>
<input type="file" id="camEnv" accept="image/*" capture="environment" hidden>
<script>
/* ===================== dasar ===================== */
const API = window.SOMTUM_API_URL || '';
const LS = 'somtum_session_v1';
let S = { staff: null, token: null, cfg: null, schemas: {}, staffList: [] };
let nav = [];

const $ = id => document.getElementById(id);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function tglCantik(s) { if (!s) return ''; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return s; const d = new Date(+m[1], +m[2] - 1, +m[3]); return HARI[d.getDay()] + ', ' + (+m[3]) + ' ' + BULAN[+m[2] - 1] + ' ' + m[1]; }
function driveThumb(url) { const m = String(url || '').match(/\/d\/([^\/]+)/); return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w300' : ''; }

let toastT;
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2800); }
function loading(on, text) { $('loadingText').textContent = text || 'Memproses…'; $('loading').classList.toggle('on', !!on); }

function modal(html) { $('modalBody').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); $('modalBody').innerHTML = ''; }
function ask(title, html, buttons) {
return new Promise(res => {
modal(`<h3 style="margin:0 0 8px">${h(title)}</h3><div>${html || ''}</div><div class="mt" id="askBtns"></div>`);
(buttons || [{ label: 'OK', value: true, cls: 'primary' }]).forEach(b => {
const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
el.onclick = () => { closeModal(); res(b.value); }; $('askBtns').appendChild(el);
});
});
}

async function api(action, payload) {
if (!/^https?:/.test(API)) throw new Error('Alamat API belum diisi (config.js).');
const body = Object.assign({ action: action }, payload || {});
if (S.staff) { body.staffId = S.staff.id; body.token = S.token; }
let r;
try {
r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
} catch (e) { throw new Error(navigator.onLine ? 'Tidak bisa terhubung ke server.' : 'Tidak ada koneksi internet.'); }
const j = await r.json();
if (!j.ok) {
if (/Sesi tidak valid/.test(j.error || '')) { logout(false); }
throw new Error(j.error || 'Gagal');
}
return j.data;
}

/* ===================== order bahan (ke sheet Stock) ===================== */
const STOCK_API = 'https://script.google.com/macros/s/AKfycbwlqav7YAXTuWmgFTzfOsHaXF5oaeDwlwgDq2eLNAa6z0C367YsdxgyOw_W8vdOHQ1m/exec';
const ORDER_KEY = 'somtum-order-2026';
async function apiStock(action, payload) {
  const body = Object.assign({ key: ORDER_KEY, action: action, staffId: (S.staff && S.staff.id) || '', token: S.token || '' }, payload || {});
  let r;
  try { r = await fetch(STOCK_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' }); }
  catch (e) { throw new Error(navigator.onLine ? 'Tidak bisa terhubung ke server stok.' : 'Tidak ada koneksi internet.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Gagal');
  return j.data;
}
const OM = { master: [], cart: [], q: '', cat: '', bagian: '' };
/* ===================== barang masuk (goods received) ===================== */
const BM = { master: [], q: '', cart: [], catatan: '' }; // BM = Barang Masuk

async function renderBarangMasuk() {
  page('Barang Masuk', '<div class="muted center mt">Memuat daftar master…</div>');
  if (!BM.master.length) {
    try { BM.master = await apiStock('order_master'); }
    catch (e) { return page('Barang Masuk', `<div class="card"><div class="muted">${h(e.message)}</div><button class="btn mt" onclick="renderBarangMasuk()">Coba lagi</button></div>`); }
  }
  drawBarangMasuk();
}

function bmListHtml() {
  const q = BM.q.trim().toLowerCase();
  const arr = q ? BM.master.filter(m => m.barang.toLowerCase().indexOf(q) >= 0) : BM.master;
  const list = arr.slice(0, 40);
  return list.map(m => { const i = BM.master.indexOf(m); const inCart = BM.cart.some(c => c._i === i);
    return `<div class="cb" onclick="bmPick(${i})"><div class="grow"><b>${h(m.barang)}</b> <span class="muted">${h(m.satuan)}</span><div class="muted" style="font-size:12px">${m.bagian === 'FOH' ? 'FOH' : 'Kitchen'}</div></div><div class="btn sm ${inCart ? 'ok' : ''}" style="pointer-events:none">${inCart ? '✓' : '+'}</div></div>`;
  }).join('') + (arr.length > 40 ? `<div class="muted center mt">…${arr.length - 40} item lagi, ketik lebih spesifik</div>` : (arr.length ? '' : '<div class="muted center">Tidak ada yang cocok</div>'));
}

function drawBarangMasuk() {
  let body = `<div class="card"><input type="text" id="bmQ" placeholder="Cari barang (${BM.master.length} item)…" value="${h(BM.q)}" autocomplete="off"><div id="bmList" style="margin-top:8px">${bmListHtml()}</div></div>`;
  body += `<h3 style="margin:14px 0 8px;font-size:14px;color:var(--mut)">Barang Diterima (${BM.cart.length})</h3>`;
  if (!BM.cart.length) body += '<div class="muted mb">Belum ada. Tap item + untuk menambah.</div>';
  else {
    body += BM.cart.map((c, i) => `<div class="rowcard"><div class="rh"><span>${h(c.barang)} <span class="muted">(${c.bagian === 'FOH' ? 'FOH' : 'Kitchen'})</span></span><button class="btn sm ghost" onclick="bmDel(${i})">Hapus</button></div>
      <div class="row mt"><input type="text" inputmode="decimal" style="flex:1" value="${h(c.jumlah)}" oninput="BM.cart[${i}].jumlah=this.value" placeholder="Jumlah"><div class="muted" style="min-width:64px;text-align:right">${h(c.satuan || '')}</div></div>
      <div class="row mt" style="font-size:13px"><input type="text" style="flex:1" value="${h(c.supplier || '')}" oninput="BM.cart[${i}].supplier=this.value" placeholder="Supplier (opsional)"></div></div>`).join('');
    body += `<label class="f">Catatan (opsional)</label><input type="text" id="bmCat" placeholder="mis. kondisi barang" value="${h(BM.catatan || '')}" oninput="BM.catatan=this.value">`;
    body += `<button class="btn primary mt" id="bmKirimBtn" onclick="bmKirim()">Catat ${BM.cart.length} barang masuk</button>`;
  }
  page('Barang Masuk', body);
  const inp = $('bmQ');
  if (inp) { inp.addEventListener('input', e => { BM.q = e.target.value; const el = $('bmList'); if (el) el.innerHTML = bmListHtml(); }); }
}

function bmPick(i) {
  const m = BM.master[i]; if (!m) return;
  if (BM.cart.some(c => c._i === i)) { toast(m.barang + ' sudah di list'); return; }
  BM.cart.push({ _i: i, bagian: m.bagian, barang: m.barang, supplier: '', satuan: m.satuan, jumlah: '' });
  BM._sendId = null;
  drawBarangMasuk();
}

function bmDel(i) { BM.cart.splice(i, 1); BM._sendId = null; drawBarangMasuk(); }

async function bmKirim() {
  if (!BM.cart.length || BM._busy) return;
  const items = BM.cart.map(c => ({ bagian: c.bagian, barang: c.barang, supplier: c.supplier || '', satuan: c.satuan, jumlah: String(c.jumlah || '').trim() }));
  const sig = JSON.stringify(items) + '|' + (BM.catatan || '');
  if (BM._sendSig !== sig) { BM._sendId = null; BM._sendSig = sig; }
  if (!BM._sendId) BM._sendId = 'bm' + Date.now() + Math.random().toString(36).slice(2, 8);
  BM._busy = true;
  const btn = $('bmKirimBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Mengirim… (bisa beberapa detik)'; }
  loading(true, 'Catat barang masuk… jangan tutup halaman');
  try {
    const r = await apiStock('barang_masuk_add', { items: items, oleh: S.staff.panggilan || S.staff.nama, catatan: BM.catatan || '', idempotencyKey: BM._sendId });

const INVENTORY_API = window.INVENTORY_API || '';
async function apiInv(action, payload) {
  if (!/^https?:/.test(INVENTORY_API)) throw new Error('Backend Cek Stock belum disetel (isi INVENTORY_API di config.js).');
  const body = Object.assign({ action: action, staffId: (S.staff && S.staff.id) || '', token: S.token || '' }, payload || {});
  let r;
  try { r = await fetch(INVENTORY_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' }); }
  catch (e) { throw new Error(navigator.onLine ? 'Tidak bisa terhubung ke server stok.' : 'Tidak ada koneksi internet.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Gagal');

}

const BEL = { bagian: 'all', data: null, busyId: null };
function belBagianChips() {

/* ===================== foto ===================== */
function ambilFoto(facing) {
return new Promise(res => {
const inp = facing === 'user' ? $('camUser') : $('camEnv');
inp.value = '';
inp.onchange = () => {
const f = inp.files && inp.files[0];
if (!f) return res(null);
const url = URL.createObjectURL(f); const img = new Image();
img.onload = () => {
const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72));
};
img.onerror = () => res(null);
img.src = url;
};
inp.click();
});
}

/* ===================== form dinamis ===================== */
const FS = {}; // state form aktif
function newRow(sc) {
const a = {};
sc.pages.forEach(p => p.items.forEach(q => {
if (q.staffField) a[q.id] = staffValue(q);
else if (q.type === 'DATE' && /tanggal|tgl/i.test(q.title) && !/kadaluarsa|expired|exp\b|lahir/i.test(q.title)) a[q.id] = todayStr();
}));
return a;
}
function staffValue(q) {
const cand = [S.staff.panggilan, S.staff.nama].filter(Boolean);
if (q.choices && q.choices.length) {
const hit = q.choices.find(c => cand.some(n => c.v.toLowerCase() === n.toLowerCase())) || q.choices.find(c => cand.some(n => c.v.toLowerCase().indexOf(n.toLowerCase()) >= 0));
return hit ? hit.v : '';
}
return S.staff.panggilan;
}
function openForm(i) { const f = S.cfg.forms[i]; if (f) show(() => renderForm(f.key, f.title)); }
function openFormKey(key) { const f = (S.cfg.forms || []).find(x => x.key === key); if (f) renderForm(f.key, f.title); else renderHome(); }
async function renderForm(key, title) {
page(title, '<div class="muted center mt">Memuat form…</div>');
let sc = S.schemas[key];
if (!sc) { try { sc = await api('form_schema', { key: key }); S.schemas[key] = sc; } catch (e) { return page(title, `<div class="card"><div class="muted">${h(e.message)}</div></div>`); } }
FS.key = key; FS.sc = sc; FS.multi = sc.pages.length === 1 && key !== 'closing';
FS.rows = [newRow(sc)]; FS.pageIdx = 0; FS.hist = [];
drawForm();
}
function drawForm() {
const sc = FS.sc, title = sc.title;
const shared = FS.multi ? sc.pages[0].items.filter(q => q.staffField) : [];
let body = sc.desc ? `<div class="muted mb">${h(sc.desc)}</div>` : '';
if (FS.multi) {
const items = sc.pages[0].items.filter(q => !q.staffField);
body += shared.length ? `<div class="card">${shared.map(q => fieldHtml(q, 0)).join('')}</div>` : '';
body += FS.rows.map((row, i) => `<div class="rowcard" id="row${i}"><div class="rh"><span>${FS.rows.length > 1 ? 'Data ' + (i + 1) : ''}</span>${FS.rows.length > 1 ? `<button class="btn sm ghost" onclick="hapusRow(${i})">Hapus</button>` : ''}</div>${items.map(q => fieldHtml(q, i)).join('')}</div>`).join('');
body += `<button class="btn" onclick="tambahRow()">＋ Tambah data lagi</button><button class="btn primary" onclick="kirimForm()">Kirim ${FS.rows.length > 1 ? FS.rows.length + ' data' : ''}</button>`;
} else {
const p = sc.pages[FS.pageIdx];
body += sc.pages.length > 1 ? `<div class="muted mb">Bagian ${FS.hist.length + 1}${p.title ? ' · ' + h(p.title) : ''}</div>` : '';
body += `<div class="card">${p.items.map(q => fieldHtml(q, 0)).join('')}</div>`;
const nxt = nextPage();
body += (nxt === 'submit') ? `<button class="btn primary" onclick="kirimForm()">Kirim</button>` : `<button class="btn primary" onclick="lanjutPage()">Lanjut ›</button>`;
if (FS.hist.length) body += `<button class="btn" onclick="mundurPage()">‹ Kembali</button>`;
}
page(title, body);
wireFields();
}
function fieldHtml(q, r) {
const v = FS.rows[r][q.id];
const lbl = `<label class="f">${h(q.title)}${q.required ? ' <span class="req">*</span>' : ''}</label>${q.help ? `<div class="help">${h(q.help)}</div>` : ''}`;
const d = `data-r="${r}" data-q="${h(q.id)}"`;
switch (q.type) {
case 'INFO': return `<div class="sep"></div><div style="font-weight:600">${h(q.title)}</div>${q.help ? `<div class="help">${h(q.help)}</div>` : ''}`;
case 'TEXT': { const num = /jumlah|harga|total|nominal|qty|sisa|berat/i.test(q.title) && !/nama|nomor|no\.|catatan/i.test(q.title); return lbl + `<input type="text" ${num ? 'inputmode="decimal"' : ''} ${d} value="${h(v || '')}" id="f${r}_${q.id}">`; }
case 'PARAGRAPH_TEXT': return lbl + `<textarea ${d} id="f${r}_${q.id}">${h(v || '')}</textarea>`;
case 'DATE': return lbl + `<input type="date" ${d} value="${h(v || '')}" id="f${r}_${q.id}">`;
case 'TIME': return lbl + `<input type="time" ${d} value="${h(v || '')}" id="f${r}_${q.id}">`;
case 'DATETIME': return lbl + `<input type="datetime-local" ${d} value="${h(v || '')}" id="f${r}_${q.id}">`;
case 'SCALE': { let s = ''; for (let i = q.min; i <= q.max; i++) s += `<button class="chipb ${String(v) === String(i) ? 'on' : ''}" ${d} data-v="${i}" onclick="setChip(this)">${i}</button>`; return lbl + `<div class="chips" id="f${r}_${q.id}">${s}</div>`; }
case 'MULTIPLE_CHOICE': {
const known = (q.choices || []).some(c => c.v === v);
let s = (q.choices || []).map(c => `<button class="chipb ${chipCls(c.v)} ${v === c.v ? 'on' : ''}" ${d} data-v="${h(c.v)}" onclick="setChip(this)">${h(c.v)}</button>`).join('');
if (q.other) s += `<button class="chipb ${v && !known ? 'on' : ''}" ${d} data-v="__other" onclick="setChip(this)">Lainnya</button>`;
return lbl + `<div class="chips" id="f${r}_${q.id}">${s}</div>` + (q.other ? `<input type="text" placeholder="Tulis jawaban lain" class="mt ${v && !known ? '' : 'hidden'}" ${d} data-other="1" value="${h(v && !known ? v : '')}" id="o${r}_${q.id}">` : '');
}
case 'CHECKBOX': {
const arr = Array.isArray(v) ? v : [];
return lbl + `<div id="f${r}_${q.id}">${(q.choices || []).map(c => `<div class="cb ${arr.indexOf(c.v) >= 0 ? 'on' : ''}" ${d} data-v="${h(c.v)}" onclick="toggleCb(this)"><div class="box">✓</div><div>${h(c.v)}</div></div>`).join('')}</div>`;
}
case 'LIST': return lbl + `<div class="sel" id="f${r}_${q.id}" ${d}><input type="text" class="selin" placeholder="Ketik untuk cari…" autocomplete="off" value="${h(v || '')}"><div class="selopts hidden"></div></div>`;
case 'FOTO': return lbl + `<div id="f${r}_${q.id}">${v ? `<img src="${v}" class="thumb mb" alt="">` : ''}<button class="btn" onclick="fotoField(${r},'${h(q.id)}')">📷 ${v ? 'Ganti foto' : 'Ambil foto'}</button></div>`;
default: return '';
}
}
function chipCls(v) { const s = String(v).toLowerCase(); if (/^(aman|ada|ok|cukup|ya)$/.test(s)) return 'ok'; if (/menipis|sedikit|hampir/.test(s)) return 'warn'; if (/habis|kosong|tidak/.test(s)) return 'bad'; return ''; }
function wireFields() {
document.querySelectorAll('main input[data-q], main textarea[data-q]').forEach(el => {
el.addEventListener('input', () => { FS.rows[+el.dataset.r][el.dataset.q] = el.value; el.classList.remove('err'); });
});
document.querySelectorAll('main .sel').forEach(sel => {
const r = +sel.dataset.r, id = sel.dataset.q, q = findQ(id), inp = sel.querySelector('input'), opts = sel.querySelector('.selopts');
const render = () => {
const t = inp.value.trim().toLowerCase();
const list = (q.choices || []).filter(c => !t || c.v.toLowerCase().indexOf(t) >= 0).slice(0, 60);
opts.innerHTML = list.length ? list.map(c => `<div data-v="${h(c.v)}">${h(c.v)}</div>`).join('') : '<div class="muted">Tidak ada yang cocok</div>';
opts.classList.remove('hidden');
};
inp.addEventListener('focus', render); inp.addEventListener('input', () => { FS.rows[r][id] = inp.value; sel.classList.remove('err'); render(); });
inp.addEventListener('blur', () => setTimeout(() => opts.classList.add('hidden'), 180));
opts.addEventListener('mousedown', e => { const d = e.target.closest('[data-v]'); if (!d) return; inp.value = d.dataset.v; FS.rows[r][id] = d.dataset.v; opts.classList.add('hidden'); sel.classList.remove('err'); });
});
}
function findQ(id) { let f = null; FS.sc.pages.forEach(p => p.items.forEach(q => { if (q.id === id) f = q; })); return f; }
function setChip(b) {
const r = +b.dataset.r, id = b.dataset.q, v = b.dataset.v, wrap = b.parentElement;
wrap.querySelectorAll('.chipb').forEach(x => x.classList.remove('on')); b.classList.add('on'); wrap.classList.remove('err');
const other = $('o' + r + '_' + id);
if (v === '__other') { FS.rows[r][id] = other ? other.value : ''; if (other) { other.classList.remove('hidden'); other.focus(); } }
else { FS.rows[r][id] = v; if (other) other.classList.add('hidden'); }
}
function toggleCb(el) {
const r = +el.dataset.r, id = el.dataset.q, v = el.dataset.v; el.classList.toggle('on');
const arr = Array.isArray(FS.rows[r][id]) ? FS.rows[r][id] : [];
FS.rows[r][id] = el.classList.contains('on') ? arr.concat([v]) : arr.filter(x => x !== v);
}
async function fotoField(r, id) { const f = await ambilFoto('environment'); if (!f) return; FS.rows[r][id] = f; drawForm(); }
function tambahRow() { const row = newRow(FS.sc); FS.sc.pages[0].items.filter(q => q.staffField).forEach(q => row[q.id] = FS.rows[0][q.id]); FS.rows.push(row); drawForm(); setTimeout(() => { const el = $('row' + (FS.rows.length - 1)); el && el.scrollIntoView({ behavior: 'smooth' }); }, 50); }
function hapusRow(i) { FS.rows.splice(i, 1); drawForm(); }
function nextPage() {
const p = FS.sc.pages[FS.pageIdx];
for (const q of p.items) { if (q.choices && FS.rows[0][q.id] != null) { const c = q.choices.find(c => c.v === FS.rows[0][q.id]); if (c && c.goto != null) return c.goto; } }
return p.next == null ? (FS.pageIdx + 1 < FS.sc.pages.length ? FS.pageIdx + 1 : 'submit') : p.next;
}
function validasi(items, r) {
let firstBad = null;
items.forEach(q => {
if (!q.required || q.type === 'INFO') return;
let v = FS.rows[r][q.id];
if (q.type === 'LIST' && v) { const hit = (q.choices || []).find(c => c.v.toLowerCase() === String(v).toLowerCase()); if (hit) { v = hit.v; FS.rows[r][q.id] = v; } else v = ''; }
const empty = v == null || v === '' || (Array.isArray(v) && !v.length);
if (empty) { const el = $('f' + r + '_' + q.id); if (el) { el.classList.add('err'); if (!firstBad) firstBad = el; } }
});
if (firstBad) { firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('Lengkapi isian yang bertanda *'); return false; }
return true;
}
function lanjutPage() {
if (!validasi(FS.sc.pages[FS.pageIdx].items, 0)) return;
const n = nextPage(); if (n === 'submit') return kirimForm();
FS.hist.push(FS.pageIdx); FS.pageIdx = n; drawForm();
}
function mundurPage() { if (!FS.hist.length) return; FS.pageIdx = FS.hist.pop(); drawForm(); }
async function kirimForm() {
if (FS.multi) { for (let i = 0; i < FS.rows.length; i++) if (!validasi(FS.sc.pages[0].items, i)) return; }
else { if (!validasi(FS.sc.pages[FS.pageIdx].items, 0)) return; }
let rows;
if (FS.multi) { const shared = FS.sc.pages[0].items.filter(q => q.staffField); rows = FS.rows.map(r => { const o = Object.assign({}, r); shared.forEach(q => o[q.id] = FS.rows[0][q.id]); return o; }); }
else { const visited = FS.hist.concat([FS.pageIdx]); const a = {}; visited.forEach(pi => FS.sc.pages[pi].items.forEach(q => { if (FS.rows[0][q.id] != null) a[q.id] = FS.rows[0][q.id]; })); rows = [a]; }
loading(true, 'Mengirim…');
try {
const r = await api('form_submit', { key: FS.key, rows: rows });
loading(false);
const key = FS.key, title = FS.sc.title;
page(title, `<div class="card center"><div style="font-size:44px">✅</div><h3>${r.terkirim} data terkirim</h3><div class="muted">${r.detail.map(d => h(d.ringkas)).join('<br>')}</div></div>
<button class="btn primary" onclick="openFormKey('${h(key)}')">Isi lagi</button><button class="btn" onclick="renderHome()">Ke beranda</button>`);
} catch (e) { loading(false); toast(e.message, 5000); }
}

page('Izin / sakit / cuti', `<div class="card"><h3>Ajukan</h3><label class="f">Jenis</label><div class="chips">${['Izin', 'Sakit', 'Cuti'].map(j => `<button class="chipb ${IZ.jenis === j ? 'on' : ''}" onclick="IZ.jenis='${j}';renderIzin()">${j}</button>`).join('')}</div>
<label class="f">Tanggal mulai</label><input type="date" id="izMulai" value="${h(IZ.mulai || todayStr())}">
<label class="f">Tanggal selesai</label><input type="date" id="izSelesai" value="${h(IZ.selesai || '')}">
<label class="f">Alasan</label><textarea id="izAlasan" placeholder="Contoh: acara keluarga / demam">${h(IZ.alasan || '')}</textarea>
${IZ.jenis === 'Sakit' ? `<label class="f">Surat dokter (wajib)</label>${IZ.surat ? `<img src="${IZ.surat}" class="thumb mb" alt="">` : ''}<button class="btn" onclick="izSurat()">📷 ${IZ.surat ? 'Ganti surat dokter' : 'Upload surat dokter'}</button><div class="muted" style="font-size:12px;margin-top:6px">Sakit wajib melampirkan surat dokter. Tanpa surat, pengajuan tidak bisa dikirim &amp; gaji hari itu tidak dihitung.</div>` : ''}<button class="btn primary mt" onclick="kirimIzin()">Ajukan</button></div>
<div id="izList"><div class="muted center">Memuat…</div></div>`);
['izMulai', 'izSelesai', 'izAlasan'].forEach(id => $(id).addEventListener('input', e => IZ[id === 'izMulai' ? 'mulai' : id === 'izSelesai' ? 'selesai' : 'alasan'] = e.target.value));
loadIzin();
}
async function izSurat() { const f = await ambilFoto('environment'); if (f) { IZ.surat = f; renderIzin(); } } function izAlasanHtml(x) { x = String(x || ''); const m = x.match(/(https?:\/\/\S+)/); if (m) { return h(x.slice(0, m.index)) + `<a href="${h(m[1])}" target="_blank">📄 Lihat surat dokter</a>`; } return h(x); } async function loadIzin() {
try {
const list = await api('izin_list');
const mgr = roleAtLeast('manager');
$('izList').innerHTML = `<h3 style="font-size:14px;color:var(--mut);margin:14px 0 8px">${roleAtLeast('kepala') ? 'Pengajuan staff' : 'Pengajuan saya'}</h3>` + (list.length ? list.map(r => `<div class="card"><div class="row"><div class="grow"><b>${h(r.nama)}</b> · ${h(r.jenis)}<div class="muted">${h(r.mulai)}${r.selesai && r.selesai !== r.mulai ? ' s/d ' + h(r.selesai) : ''}</div><div class="muted">${izAlasanHtml(r.alasan)}</div></div><span class="badge ${r.status === 'Disetujui' ? 'b-ok' : r.status === 'Ditolak' ? 'b-bad' : 'b-warn'}">${h(r.status)}</span></div>
${mgr && r.status === 'Menunggu' ? `<div class="row mt"><button class="btn sm grow" onclick="setIzin('${h(r.id)}','Ditolak')">Tolak</button><button class="btn sm ok grow" onclick="setIzin('${h(r.id)}','Disetujui')">Setujui</button></div>` : r.oleh ? `<div class="muted">oleh ${h(r.oleh)}</div>` : ''}</div>`).join('') : '<div class="muted center">Belum ada pengajuan.</div>');
} catch (e) { $('izList').innerHTML = `<div class="muted">${h(e.message)}</div>`; }
}
async function kirimIzin() {
const mulai = $('izMulai').value, selesai = $('izSelesai').value || mulai, alasan = $('izAlasan').value.trim();
if (!mulai) return toast('Isi tanggal mulai.');
if (!alasan) return toast('Isi alasannya.'); if (IZ.jenis === 'Sakit' && !IZ.surat) return toast('Sakit wajib upload surat dokter.');
loading(true, 'Mengirim…');
try { await api('izin_ajukan2', { jenis: IZ.jenis, tglMulai: mulai, tglSelesai: selesai, alasan: alasan, surat: IZ.surat || '' }); loading(false); IZ.alasan = ''; IZ.selesai = ''; IZ.surat = ''; toast('Pengajuan terkirim, menunggu persetujuan.'); renderIzin(); }
catch (e) { loading(false); toast(e.message, 4000); }
}
async function setIzin(id, status) {
loading(true); try { await api('izin_set', { id: id, status: status }); loading(false); loadIzin(); } catch (e) { loading(false); toast(e.message); }
}

/* ===================== jadwal ===================== */
const JD = {};
function seninDari(d) { const x = new Date(d); const u = (x.getDay() + 6) % 7; x.setDate(x.getDate() - u); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); }
function geserMinggu(s, n) { const m = s.split('-').map(Number); const d = new Date(m[0], m[1] - 1, m[2] + 7 * n); return seninDari(d); }
function tambahHari(s, n) { const m = s.split('-').map(Number); const d = new Date(m[0], m[1] - 1, m[2] + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
async function renderJadwal() {
JD.minggu = JD.minggu || seninDari(new Date());
page('Jadwal shift', `<div class="card"><div class="row"><button class="iconbtn" onclick="JD.minggu=geserMinggu(JD.minggu,-1);renderJadwal()">‹</button><div class="grow center"><b>Minggu ${h(tglCantik(JD.minggu).replace('Senin, ', ''))}</b><div class="muted">s/d ${h(tglCantik(tambahHari(JD.minggu, 6)).replace('Minggu, ', ''))}</div></div><button class="iconbtn" onclick="JD.minggu=geserMinggu(JD.minggu,1);renderJadwal()">›</button></div></div><div id="jdBody" class="card"><div class="muted">Memuat…</div></div>`);
try {
const r = await api('jadwal_get', { minggu: JD.minggu }); JD.data = r;
const edit = roleAtLeast('kepala');
const opt = v => `<option value="">–</option>` + r.shifts.map(s => `<option ${v === s ? 'selected' : ''}>${h(s)}</option>`).join('');
$('jdBody').innerHTML = `<div class="wrap"><table class="t"><tr><th>Staff</th>${r.hari.map(x => `<th>${x}</th>`).join('')}</tr>
${r.data.map((s, i) => `<tr><td><b>${h(s.nama)}</b><div class="muted">${h(s.divisi)}</div></td>${s.days.map((v, d) => `<td>${edit ? `<select onchange="JD.data.data[${i}].days[${d}]=this.value">${opt(v)}</select>` : `<span class="badge ${v === 'Libur' ? 'b-mut' : v ? 'b-ok' : ''}">${h(v || '–')}</span>`}</td>`).join('')}</tr>`).join('')}</table></div>
${edit ? `<button class="btn primary mt" onclick="simpanJadwal()">Simpan jadwal</button>` : ''}`;
} catch (e) { $('jdBody').innerHTML = `<div class="muted">${h(e.message)}</div>`; }
}
async function simpanJadwal() {
loading(true, 'Menyimpan…');
try { await api('jadwal_set', { minggu: JD.minggu, data: JD.data.data.map(s => ({ staffId: s.staffId, days: s.days })) }); loading(false); toast('Jadwal tersimpan.'); }
catch (e) { loading(false); toast(e.message, 4000); }
}

/* ===================== absensi hari ini & rekap ===================== */
async function renderAbsensiHariIni() {
page('Absensi hari ini', '<div class="muted center">Memuat…</div>');
try {
const list = await api('absensi_hari_ini');
const hadir = list.filter(x => x.jamMasuk).length;
page('Absensi hari ini', `<div class="muted mb">${tglCantik(todayStr())} · ${hadir} dari ${list.length} sudah masuk</div>` + list.map(x => `<div class="card"><div class="row">${x.fotoMasuk ? `<img class="ph" src="${driveThumb(x.fotoMasuk)}" alt="" onclick="window.open('${h(x.fotoMasuk)}','_blank')">` : '<div class="ph"></div>'}<div class="grow"><b>${h(x.nama)}</b> <span class="muted">${h(x.divisi)}</span><div class="muted">${x.jamMasuk ? 'Masuk ' + h(x.jamMasuk) + ' · ' + h(x.shift) : 'Belum absen'}${x.jamPulang ? ' · Pulang ' + h(x.jamPulang) : ''}</div></div><span class="badge ${x.status === 'Telat' ? 'b-bad' : x.jamMasuk ? 'b-ok' : 'b-mut'}">${h(x.status)}${x.status === 'Telat' ? ' ' + x.telat + "'" : ''}</span></div></div>`).join(''));
} catch (e) { page('Absensi hari ini', `<div class="card muted">${h(e.message)}</div>`); }
}
const RK = {};
async function renderRekap() {
RK.bulan = RK.bulan || todayStr().slice(0, 7);
page('Rekap absensi', `<div class="card"><label class="f">Bulan</label><input type="month" id="rkBulan" value="${h(RK.bulan)}"></div><div class="card" id="rkBody"><div class="muted">Memuat…</div></div>`);
$('rkBulan').addEventListener('change', e => { RK.bulan = e.target.value; renderRekap(); });
try {
const r = await api('rekap_absensi', { bulan: RK.bulan });
$('rkBody').innerHTML = `<div class="muted mb">Toleransi telat ${r.toleransi} menit. Angka ini dasar hitung gaji.</div><div class="wrap"><table class="t"><tr><th>Staff</th><th>Hadir</th><th>Telat</th><th>Plg cepat</th><th>Jam</th><th>Izin</th><th>Sakit</th><th>Cuti</th></tr>
${r.data.map(p => `<tr><td><b>${h(p.nama)}</b><div class="muted">${h(p.divisi)}</div></td><td>${p.hadir}</td><td>${p.telatKali ? p.telatKali + 'x / ' + p.telatMenit + "'" : '–'}</td><td>${p.pulangCepatKali || '–'}</td><td>${p.jam}</td><td>${p.izin || '–'}</td><td>${p.sakit || '–'}</td><td>${p.cuti || '–'}</td></tr>`).join('')}</table></div>`;
} catch (e) { $('rkBody').innerHTML = `<div class="muted">${h(e.message)}</div>`; }
}

boot();
</script>
</body>
</html>
